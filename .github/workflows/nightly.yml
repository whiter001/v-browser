name: Nightly Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

env:
  PROJECT_NAME: v-browser
  BINARY_NAME: v-browser

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install V
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: Verify formatting
        shell: bash
        run: |
          cd packages/server
          v fmt --check ./src

      - name: Run unit tests
        shell: bash
        run: |
          cd packages/server
          v -enable-globals test ./src

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "packages/extension/pnpm-lock.yaml"

      - name: Install dependencies
        run: cd packages/extension && pnpm install

      - name: Build extension
        run: cd packages/extension && pnpm run build

      - name: Package extension
        run: |
          cd packages/extension
          short_sha="${GITHUB_SHA::7}"
          run_id="${GITHUB_RUN_ID}"
          zip -r "../v-browser-extension-${short_sha}-${run_id}.zip" dist/ manifest.json icons/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: v-browser-extension
          path: packages/v-browser-extension-*-*.zip
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            bin_ext: ""
          - target: windows-x86_64
            os: windows-latest
            bin_ext: ".exe"
          - target: darwin-arm64
            os: macos-14
            bin_ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install V
        if: runner.os != 'Windows'
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: Install V (Windows prebuilt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'vlang-windows'
          $zipPath = Join-Path $installRoot 'v_windows.zip'

          if (Test-Path $installRoot) {
            Remove-Item $installRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $installRoot | Out-Null

          Invoke-WebRequest -Uri 'https://github.com/vlang/v/releases/latest/download/v_windows.zip' -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $installRoot -Force

          $vExe = Get-ChildItem -Path $installRoot -Recurse -Filter 'v.exe' | Select-Object -First 1
          if (-not $vExe) {
            throw 'Failed to locate v.exe in the extracted V release.'
          }

          $vRoot = $vExe.Directory.FullName
          while ($vRoot -and -not (Test-Path (Join-Path $vRoot 'vlib'))) {
            $parent = Split-Path -Parent $vRoot
            if ($parent -eq $vRoot) {
              break
            }
            $vRoot = $parent
          }

          if (-not (Test-Path (Join-Path $vRoot 'vlib'))) {
            throw 'Failed to locate vlib in the extracted V release.'
          }

          Add-Content -Path $env:GITHUB_PATH -Value $vExe.Directory.FullName
          Add-Content -Path $env:GITHUB_ENV -Value "VROOT=$vRoot"

          & $vExe.FullName version

      - name: Build binary
        shell: bash
        run: |
          cd packages/server
          mkdir -p bin
          v -enable-globals -o "bin/${BINARY_NAME}${{ matrix.bin_ext }}" ./src

      - name: Package artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          run_id="${GITHUB_RUN_ID}"
          artifact_dir="${PROJECT_NAME}-${{ matrix.target }}"
          binary_name="${BINARY_NAME}${{ matrix.bin_ext }}"
          artifact_name="${artifact_dir}-${short_sha}-${run_id}"
          mkdir -p "$artifact_name"
          cp "packages/server/bin/$binary_name" "$artifact_name/"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell -Command "Compress-Archive -Path '$artifact_name/*' -DestinationPath '$artifact_name.zip'"
          else
            zip -r "$artifact_name.zip" "$artifact_name"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.target }}
          path: ${{ env.PROJECT_NAME }}-${{ matrix.target }}-*-*.zip
          if-no-files-found: error

  release:
    name: Publish nightly release
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Update nightly tag
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch --tags
          git tag -f nightly
          git push origin nightly --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release body
        id: release_body
        shell: bash
        run: |
          now=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          short_sha="${GITHUB_SHA::7}"
          run_id="${GITHUB_RUN_ID}"
          trigger="${{ github.event_name }}"
          ref_name="${{ github.ref_name }}"
          {
            echo 'BODY<<EOF'
            echo '## 🌙 Nightly build'
            echo
            echo 'This is an automated nightly build for `v-browser`.'
            echo
            echo '### Build details'
            echo
            echo "- Generated at: ${now}"
            echo "- Trigger: ${trigger}"
            echo "- Ref: ${ref_name}"
            echo "- Commit: ${short_sha} (${{ github.sha }})"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '### Included artifacts'
            echo
            echo "- \`v-browser-linux-x86_64-${short_sha}-${run_id}.zip\`"
            echo "- \`v-browser-windows-x86_64-${short_sha}-${run_id}.zip\`"
            echo "- \`v-browser-darwin-arm64-${short_sha}-${run_id}.zip\`"
            echo "- \`v-browser-extension-${short_sha}-${run_id}.zip\` (Browser Extension)"
            echo
            echo '### Verification performed'
            echo
            echo '- V formatting check (`v fmt --check ./src`)'
            echo '- Full unit test suite (`v -enable-globals test ./src`)'
            echo '- Multi-platform binary build with `-enable-globals`'
            echo
            echo '### Notes'
            echo
            echo '- This release is automatically updated in place under the `nightly` tag.'
            echo '- It is intended for validation and early testing, not as a stable release.'
            echo '- The packaged executable name is `v-browser` (or `v-browser.exe` on Windows).'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Cleaning up existing nightly release..."
          gh release delete nightly --yes --cleanup-tag || true

          # Wait a bit for GitHub API to sync
          sleep 2

          echo "Creating new nightly release..."
          gh release create nightly \
            --title "v-browser nightly build" \
            --notes "${{ steps.release_body.outputs.BODY }}" \
            --prerelease \
            release-assets/*.zip
