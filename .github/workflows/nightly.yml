name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

env:
  PROJECT_NAME: v-browser
  BINARY_NAME: v-browser

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: Verify formatting
        shell: bash
        run: |
          cd packages/server
          v fmt --check ./src

      - name: Run unit tests
        shell: bash
        run: |
          cd packages/server
          v -enable-globals test ./src

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'packages/extension/pnpm-lock.yaml'

      - name: Install dependencies
        run: cd packages/extension && pnpm install

      - name: Build extension
        run: cd packages/extension && pnpm run build

      - name: Package extension
        run: |
          cd packages/extension
          zip -r ../v-browser-extension.zip dist/ manifest.json icons/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-browser-extension
          path: packages/v-browser-extension.zip
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            bin_ext: ""
          - target: windows-x86_64
            os: windows-latest
            bin_ext: ".exe"
          - target: darwin-arm64
            os: macos-14
            bin_ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install V
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: Build binary
        shell: bash
        run: |
          mkdir -p bin
          binary_path="bin/${BINARY_NAME}${{ matrix.bin_ext }}"
          cd packages/server
          v -enable-globals -o "$binary_path" ./src

      - name: Package artifact
        shell: bash
        run: |
          artifact_dir="${PROJECT_NAME}-${{ matrix.target }}"
          binary_name="${BINARY_NAME}${{ matrix.bin_ext }}"
          mkdir -p "$artifact_dir"
          cp "bin/$binary_name" "$artifact_dir/"
          zip -r "$artifact_dir.zip" "$artifact_dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.target }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

  release:
    name: Publish nightly release
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: nightly-assets
          merge-multiple: true

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: v-browser-extension
          path: .

      - name: Update nightly tag
        uses: richardsimko/update-tag@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          force: true

      - name: Generate release body
        id: release_body
        shell: bash
        run: |
          now=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          short_sha="${GITHUB_SHA::7}"
          trigger="${{ github.event_name }}"
          ref_name="${{ github.ref_name }}"
          {
            echo 'BODY<<EOF'
            echo '## 🌙 Nightly build'
            echo
            echo 'This is an automated nightly build for `v-browser`.'
            echo
            echo '### Build details'
            echo
            echo "- Generated at: ${now}"
            echo "- Trigger: ${trigger}"
            echo "- Ref: ${ref_name}"
            echo "- Commit: ${short_sha} (${{ github.sha }})"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '### Included artifacts'
            echo
            echo '- `v-browser-linux-x86_64.zip`'
            echo '- `v-browser-windows-x86_64.zip`'
            echo '- `v-browser-darwin-arm64.zip`'
            echo '- `v-browser-extension.zip` (Browser Extension)'
            echo
            echo '### Verification performed'
            echo
            echo '- V formatting check (`v fmt --check ./src`)'
            echo '- Full unit test suite (`v -enable-globals test ./src`)'
            echo '- Multi-platform binary build with `-enable-globals`'
            echo
            echo '### Notes'
            echo
            echo '- This release is automatically updated in place under the `nightly` tag.'
            echo '- It is intended for validation and early testing, not as a stable release.'
            echo '- The packaged executable name is `v-browser` (or `v-browser.exe` on Windows).'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish nightly release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "nightly-assets/*.zip,v-browser-extension.zip"
          tag: nightly
          name: v-browser nightly build
          body: ${{ steps.release_body.outputs.BODY }}
          allowUpdates: true
          prerelease: true
          makeLatest: false
          replacesArtifacts: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
